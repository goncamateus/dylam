<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ablation Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a;
    --ink-faint: #666;
    --surface: #fff;
    --surface-alt: #f0f0f0;
    --border: #e0e0e0;
    --border-soft: #bbb;
    --grid-line: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e8e8;
      --ink-faint: #999;
      --surface: #262626;
      --surface-alt: #2f2f2f;
      --border: #444;
      --border-soft: #555;
      --grid-line: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: transparent; color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  .controls {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin: 4px 0 12px; padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { font-size: 0.85rem; color: var(--ink-faint); white-space: nowrap; }
  select {
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-soft);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .panels { display: flex; gap: 14px; flex-wrap: wrap; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; flex: 1 1 300px; min-width: 260px;
  }
  .panel h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-faint); margin: 0 0 4px; text-align: center;
  }
  svg { display: block; max-width: 100%; height: auto; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 2px 0; font-size: 0.8rem; }
  #legend .swatch { display: inline-flex; align-items: center; gap: 5px; }
  #legend .dot { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .axis-line { stroke: var(--ink-faint); stroke-width: 1; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; }
  .tick-text { font-size: 9px; fill: var(--ink-faint); }
</style>
</head>
<body>
<main>
  <div class="controls">
    <div class="control-group">
      <label for="sweep-select">Sweep</label>
      <select id="sweep-select"></select>
    </div>
    <div class="control-group">
      <label for="kind-select">Panel</label>
      <select id="kind-select"></select>
    </div>
  </div>
  <div class="panels" id="panels"></div>
  <div id="legend"></div>
</main>

<script>
const DATA = /*__BEYOND_PDF_DATA__*/null;

const state = { sweep: DATA.sweeps[0].key, kind: DATA.kinds[0].key };

const W = 340, H = 220, padL = 40, padB = 26, padT = 10, padR = 8;

function scaleX(x, xmin, xmax) {
  return padL + (x - xmin) / (xmax - xmin || 1) * (W - padL - padR);
}
function scaleY(y, ymin, ymax) {
  return H - padB - (y - ymin) / (ymax - ymin || 1) * (H - padT - padB);
}

function path(points) {
  return points.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
}

function drawPanel(comp) {
  const entry = DATA.panels[state.sweep][state.kind][comp];
  const grid = entry.grid;
  const xmin = grid[0], xmax = grid[grid.length - 1];
  let ymin = Infinity, ymax = -Infinity;
  for (const line of entry.lines) {
    for (const v of line.lo) ymin = Math.min(ymin, v);
    for (const v of line.hi) ymax = Math.max(ymax, v);
  }
  if (!Number.isFinite(ymin) || ymin === ymax) { ymin = 0; ymax = ymax || 1; }
  const pad = (ymax - ymin) * 0.08 || 0.1;
  ymin -= pad; ymax += pad;

  let s = "";
  for (let i = 0; i <= 4; i++) {
    const gy = padT + i * (H - padT - padB) / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}"></line>`;
  }
  for (const line of entry.lines) {
    const centre = grid.map((x, i) => [scaleX(x, xmin, xmax), scaleY(line.centre[i], ymin, ymax)]);
    const band = grid.map((x, i) => [scaleX(x, xmin, xmax), scaleY(line.hi[i], ymin, ymax)])
      .concat(grid.slice().reverse().map((x, i) =>
        [scaleX(x, xmin, xmax), scaleY(line.lo[grid.length - 1 - i], ymin, ymax)]));
    s += `<path d="${path(band)} Z" fill="${line.color}" opacity="0.18" stroke="none"></path>`;
    s += `<path d="${path(centre)}" fill="none" stroke="${line.color}" stroke-width="1.6"></path>`;
  }
  s += `<line class="axis-line" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}"></line>`;
  s += `<line class="axis-line" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}"></line>`;
  s += `<text class="tick-text" x="${padL - 4}" y="${padT + 4}" text-anchor="end">${ymax.toFixed(2)}</text>`;
  s += `<text class="tick-text" x="${padL - 4}" y="${H - padB}" text-anchor="end">${ymin.toFixed(2)}</text>`;
  s += `<text class="tick-text" x="${padL}" y="${H - 8}" text-anchor="start">0</text>`;
  s += `<text class="tick-text" x="${W - padR}" y="${H - 8}" text-anchor="end">${xmax.toFixed(0)}</text>`;
  return s;
}

function render() {
  const panelsEl = document.getElementById("panels");
  panelsEl.innerHTML = DATA.components.map(comp => `
    <div class="panel">
      <h2>${comp}</h2>
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${drawPanel(comp)}</svg>
    </div>
  `).join("");

  const legend = document.getElementById("legend");
  const first = DATA.panels[state.sweep][state.kind][DATA.components[0]];
  legend.innerHTML = first.lines.map(line =>
    `<span class="swatch"><span class="dot" style="background:${line.color}"></span>${line.label}</span>`
  ).join("");
}

function init() {
  const sweepSel = document.getElementById("sweep-select");
  sweepSel.innerHTML = DATA.sweeps.map(s => `<option value="${s.key}">${s.label}</option>`).join("");
  sweepSel.addEventListener("change", () => { state.sweep = sweepSel.value; render(); });

  const kindSel = document.getElementById("kind-select");
  kindSel.innerHTML = DATA.kinds.map(k => `<option value="${k.key}">${k.label}</option>`).join("");
  kindSel.addEventListener("change", () => { state.kind = kindSel.value; render(); });

  render();
}

init();
</script>
</body>
</html>
