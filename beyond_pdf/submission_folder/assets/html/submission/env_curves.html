<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curves Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a;
    --ink-faint: #666;
    --surface: #fff;
    --border: #e0e0e0;
    --border-soft: #bbb;
    --grid-line: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e8e8;
      --ink-faint: #999;
      --surface: #262626;
      --border: #444;
      --border-soft: #555;
      --grid-line: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: transparent; color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  .controls {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin: 4px 0 12px; padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { font-size: 0.85rem; color: var(--ink-faint); white-space: nowrap; }
  select {
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-soft);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .panels { display: flex; gap: 14px; flex-wrap: wrap; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; flex: 1 1 300px; min-width: 260px;
  }
  .panel h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-faint); margin: 0 0 4px; text-align: center;
  }
  svg { display: block; max-width: 100%; height: auto; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 2px 0; font-size: 0.8rem; }
  #legend .swatch { display: inline-flex; align-items: center; gap: 5px; }
  #legend .dot { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .axis-line { stroke: var(--ink-faint); stroke-width: 1; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; }
  .ref-line { stroke-dasharray: 4 3; stroke-width: 1; }
  .tick-text { font-size: 9px; fill: var(--ink-faint); }
</style>
</head>
<body>
<main>
  <div class="controls" id="controls"></div>
  <div class="panels" id="panels"></div>
  <div id="legend"></div>
</main>

// the template knows nothing about what the selectors mean -- the Generator
// decides whether they are sweeps x kinds, environments x metrics, or the
// next categorical pair after that.
const state = {};
for (const sel of DATA.selectors) state[sel.key] = sel.options[0].key;

function selectedGroup(key) {
  return DATA.groups[key][state[key]];
}

const W = 340, H = 220, padL = 40, padB = 26, padT = 10, padR = 8;

function scaleX(x, xmin, xmax) {
  return padL + (x - xmin) / (xmax - xmin || 1) * (W - padL - padR);
}
function scaleY(y, ymin, ymax) {
  return H - padB - (y - ymin) / (ymax - ymin || 1) * (H - padT - padB);
}

function path(points) {
  return points.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
}

function drawPanel(panel) {
  const grid = panel.grid;
  const xmin = grid[0], xmax = grid[grid.length - 1];
  let ymin = Infinity, ymax = -Infinity;
  for (const line of panel.lines) {
    for (const v of line.lo) ymin = Math.min(ymin, v);
    for (const v of line.hi) ymax = Math.max(ymax, v);
  }
  if (!Number.isFinite(ymin) || ymin === ymax) { ymin = 0; ymax = ymax || 1; }
  const pad = (ymax - ymin) * 0.08 || 0.1;
  ymin -= pad; ymax += pad;

  let s = "";
  for (let i = 0; i <= 4; i++) {
    const gy = padT + i * (H - padT - padB) / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}"></line>`;
  }
  if (panel.refs) {
    for (const ref of panel.refs) {
      if (ref.y < ymin || ref.y > ymax) continue;
      const ry = scaleY(ref.y, ymin, ymax);
      s += `<line class="ref-line" x1="${padL}" y1="${ry.toFixed(1)}" x2="${W - padR}" y2="${ry.toFixed(1)}" stroke="${ref.color}"></line>`;
    }
  }
  for (const line of panel.lines) {
    const centre = grid.map((x, i) => [scaleX(x, xmin, xmax), scaleY(line.centre[i], ymin, ymax)]);
    const band = grid.map((x, i) => [scaleX(x, xmin, xmax), scaleY(line.hi[i], ymin, ymax)])
      .concat(grid.slice().reverse().map((x, i) =>
        [scaleX(x, xmin, xmax), scaleY(line.lo[grid.length - 1 - i], ymin, ymax)]));
    s += `<path d="${path(band)} Z" fill="${line.color}" opacity="0.18" stroke="none"></path>`;
    s += `<path d="${path(centre)}" fill="none" stroke="${line.color}" stroke-width="1.6"></path>`;
  }
  s += `<line class="axis-line" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}"></line>`;
  s += `<line class="axis-line" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}"></line>`;
  s += `<text class="tick-text" x="${padL - 4}" y="${padT + 4}" text-anchor="end">${ymax.toFixed(2)}</text>`;
  s += `<text class="tick-text" x="${padL - 4}" y="${H - padB}" text-anchor="end">${ymin.toFixed(2)}</text>`;
  s += `<text class="tick-text" x="${padL}" y="${H - 8}" text-anchor="start">0</text>`;
  s += `<text class="tick-text" x="${W - padR}" y="${H - 8}" text-anchor="end">${xmax.toFixed(0)}</text>`;
  return s;
}

function render() {
  const combo = DATA.selectors.map(sel => selectedGroup(sel.key));
  // Every selector but the last contributes its `panels` sub-table; the
  // innermost one contributes the leaf panels -- the Generator's meta
  // guarantees this nesting terminates in an array of panel keys.
  let node = DATA.panels;
  for (let i = 0; i < combo.length - 1; i++) node = node[combo[i]];
  // The innermost value is either an array of panel keys (every selector
  // contributes a sub-table) or a single map of panel key -> panel key
  // (the last selector picks within one sub-table, as env x metric does).
  const leaf = node[combo[combo.length - 1]];
  const panelKeys = Array.isArray(leaf) ? leaf : Object.values(leaf);
  const meta = DATA.meta;
  const labels = combo.map((key, i) =>
    DATA.selectors[i].options.find(o => o.key === key).label);

  const panelsEl = document.getElementById("panels");
  panelsEl.innerHTML = panelKeys.map(pk => {
    const panel = meta.panels[pk];
    return `<div class="panel">
      <h2>${panel.label}</h2>
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${drawPanel(panel)}</svg>
    </div>`;
  }).join("");

  const legend = document.getElementById("legend");
  const first = meta.panels[panelKeys[0]];
  const comboLabel = labels.join(" · ");
  legend.innerHTML =
    `<span class="swatch" style="color:var(--ink-faint)">${comboLabel}</span>` +
    first.lines.map(line =>
      `<span class="swatch"><span class="dot" style="background:${line.color}"></span>${line.label}</span>`
    ).join("");
}

function init() {
  const controls = document.getElementById("controls");
  for (const sel of DATA.selectors) {
    const group = document.createElement("div");
    group.className = "control-group";
    const label = document.createElement("label");
    label.htmlFor = `select-${sel.key}`;
    label.textContent = sel.label;
    const select = document.createElement("select");
    select.id = `select-${sel.key}`;
    select.innerHTML = sel.options.map(o =>
      `<option value="${o.key}">${o.label}</option>`).join("");
    select.addEventListener("change", () => {
      state[sel.key] = select.value;
      render();
    });
    group.appendChild(label);
    group.appendChild(select);
    controls.appendChild(group);
  }
  render();
}

init();
</script>
</body>
</html>
