<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pareto Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a;
    --ink-faint: #666;
    --surface: #fff;
    --border: #e0e0e0;
    --border-soft: #bbb;
    --grid-line: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e8e8;
      --ink-faint: #999;
      --surface: #262626;
      --border: #444;
      --border-soft: #555;
      --grid-line: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: transparent; color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  .controls {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin: 4px 0 12px; padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { font-size: 0.85rem; color: var(--ink-faint); white-space: nowrap; }
  select {
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-soft);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  #plot {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px;
  }
  svg { display: block; max-width: 100%; height: auto; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 2px 0; font-size: 0.8rem; }
  #legend .swatch { display: inline-flex; align-items: center; gap: 5px; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-soft); border-radius: 6px;
    padding: 6px 10px; font-size: 0.8rem; line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25); white-space: nowrap;
  }
  .axis-line { stroke: var(--ink-faint); stroke-width: 1; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; }
  .tick-text { font-size: 10px; fill: var(--ink-faint); }
  .ref-line { stroke: var(--ink-faint); stroke-dasharray: 4 3; stroke-width: 1; }
  .point { stroke: var(--surface); stroke-width: 0.8; }
  .point:hover { stroke: var(--ink); stroke-width: 1.4; cursor: crosshair; }
</style>
</head>
<body>
<main>
  <div class="controls">
    <div class="control-group">
      <label for="proj-select">Projection</label>
      <select id="proj-select"></select>
    </div>
  </div>
  <div id="plot"></div>
  <div id="legend"></div>
  <div id="tooltip"></div>
</main>

<script>
const DATA = /*__BEYOND_PDF_DATA__*/null;

const W = 640, H = 440, padL = 56, padB = 40, padT = 14, padR = 14;

function drawPlot() {
  const meta = DATA.meta;
  const proj = DATA.projections.find(p => p.key === state.projection);
  const di = proj.axes[0], dj = proj.axes[1];
  const labels = meta.axisLabels;

  // Bounds over every method's points on the two projected axes.
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  for (const method of meta.methods) {
    const pts = meta.points[method.label];
    for (const p of pts) {
      xmin = Math.min(xmin, p.obj[di]); xmax = Math.max(xmax, p.obj[di]);
      ymin = Math.min(ymin, p.obj[dj]); ymax = Math.max(ymax, p.obj[dj]);
    }
  }
  const spanX = (xmax - xmin) || 1, spanY = (ymax - ymin) || 1;
  xmin -= spanX * 0.04; xmax += spanX * 0.04;
  ymin -= spanY * 0.04; ymax += spanY * 0.04;

  function sx(x) { return padL + (x - xmin) / (xmax - xmin) * (W - padL - padR); }
  function sy(y) { return H - padB - (y - ymin) / (ymax - ymin) * (H - padT - padB); }

  let s = "";
  for (let i = 0; i <= 4; i++) {
    const gy = padT + i * (H - padT - padB) / 4;
    s += `<line class="grid-line" x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}"></line>`;
  }
  s += `<line class="axis-line" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}"></line>`;
  s += `<line class="axis-line" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}"></line>`;
  // Tick labels: 3 per axis.
  for (let i = 0; i <= 2; i++) {
    const xv = xmin + i * (xmax - xmin) / 2;
    s += `<text class="tick-text" x="${sx(xv).toFixed(1)}" y="${H - padB + 14}" text-anchor="middle">${xv.toFixed(1)}</text>`;
    const yv = ymin + (2 - i) * (ymax - ymin) / 2;
    s += `<text class="tick-text" x="${padL - 6}" y="${(sy(yv) + 3).toFixed(1)}" text-anchor="end">${yv.toFixed(1)}</text>`;
  }
  s += `<text class="tick-text" x="${(padL + W - padR) / 2}" y="${H - 6}" text-anchor="middle" font-size="11">${labels[di]}</text>`;
  s += `<text class="tick-text" x="12" y="${(padT + H - padB) / 2}" text-anchor="middle" font-size="11" transform="rotate(-90 12 ${(padT + H - padB) / 2})">${labels[dj]}</text>`;
  // The per-component R_max lines the static figure showed (where present).
  if (meta.refs) {
    for (const ref of meta.refs) {
      if (ref.axis === di) s += `<line class="ref-line" x1="${sx(ref.value).toFixed(1)}" y1="${padT}" x2="${sx(ref.value).toFixed(1)}" y2="${H - padB}"></line>`;
      if (ref.axis === dj) s += `<line class="ref-line" x1="${padL}" y1="${sy(ref.value).toFixed(1)}" x2="${W - padR}" y2="${sy(ref.value).toFixed(1)}"></line>`;
    }
  }
  // Points, method by method. Points without weights (the coverage
  // baselines) render at full opacity; weighted points render dimmer and
  // come alive on hover -- the weighting is the reveal.
  for (const method of meta.methods) {
    const pts = meta.points[method.label];
    if (!pts.length) continue;
    const hasW = meta.weights[method.label];
    const opacity = hasW ? 0.45 : 0.85;
    s += `<g>`;
    for (const p of pts) {
      s += `<circle class="point" cx="${sx(p.obj[di]).toFixed(1)}" cy="${sy(p.obj[dj]).toFixed(1)}" r="${p.r}" fill="${method.color}" fill-opacity="${opacity}" data-method="${method.label}" data-p="${p.i}"></circle>`;
    }
    s += `</g>`;
  }
  return s;
}

const tooltip = document.getElementById("tooltip");

function attachHover(svg) {
  const meta = DATA.meta;
  svg.addEventListener("mousemove", (ev) => {
    const t = ev.target;
    if (!t.classList || !t.classList.contains("point")) {
      tooltip.style.display = "none";
      return;
    }
    const methodLabel = t.getAttribute("data-method");
    const idx = +t.getAttribute("data-p");
    const p = meta.points[methodLabel][idx];
    const rows = [];
    for (let i = 0; i < meta.axisLabels.length; i++) {
      rows.push(`<strong>${meta.axisLabels[i]}</strong>: ${p.obj[i].toFixed(3)}`);
    }
    const w = meta.weights[methodLabel];
    if (w) {
      rows.push(`<em>λ weights</em>: ` +
        w.values[p.i].map((v, i) => `${meta.weightLabels[i]} ${v.toFixed(3)}`).join(", "));
      rows.push(`<span style="color:var(--ink-faint)">${w.note}</span>`);
    }
    tooltip.innerHTML = `<strong style="color:${meta.methods.find(m => m.label === methodLabel).color}">${methodLabel}</strong><br>` + rows.join("<br>");
    tooltip.style.display = "block";
    tooltip.style.left = (ev.clientX + 14) + "px";
    tooltip.style.top = (ev.clientY + 14) + "px";
  });
  svg.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
}

const state = { projection: DATA.projections[0].key };

function render() {
  const plot = document.getElementById("plot");
  plot.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${drawPlot()}</svg>`;
  attachHover(plot.querySelector("svg"));
}

function init() {
  const sel = document.getElementById("proj-select");
  sel.innerHTML = DATA.projections.map(p =>
    `<option value="${p.key}">${p.label}</option>`).join("");
  sel.addEventListener("change", () => { state.projection = sel.value; render(); });

  const legend = document.getElementById("legend");
  legend.innerHTML = DATA.meta.methods.filter(m => {
    // Only methods with points somewhere are legend entries.
    return DATA.meta.points[m.label].length > 0;
  }).map(m =>
    `<span class="swatch"><span class="dot" style="background:${m.color}"></span>${m.label}</span>`
  ).join("");

  render();
}

init();
</script>
</body>
</html>
